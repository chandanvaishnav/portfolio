<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#avatarGrad)" rx="100"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="6,4"/>
  
  <!-- Stylized Initials Monogram -->
  <text x="100" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="-1">CV</text>
  
  <!-- Subtle label at bottom -->
  <rect x="52" y="145" width="96" height="22" rx="11" fill="#1e3a8a" fill-opacity="0.8"/>
  <text x="100" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#93c5fd" text-anchor="middle">Chandan Vishnav</text>
</svg>
