<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAdaptive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#161c2e" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="stressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bgAdaptive)" rx="12"/>

  <!-- Main System Console Window -->
  <rect x="45" y="35" width="510" height="270" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.5"/>
  
  <!-- Window Header -->
  <rect x="45" y="35" width="510" height="34" rx="8" fill="#0f172a"/>
  <circle cx="68" cy="52" r="4.5" fill="#ef4444"/>
  <circle cx="84" cy="52" r="4.5" fill="#f59e0b"/>
  <circle cx="100" cy="52" r="4.5" fill="#10b981"/>
  <text x="120" y="56" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Adaptive Examination Engine — JVM Telemetry &amp; IRT Model</text>
  <rect x="430" y="44" width="110" height="18" rx="9" fill="#1e3a8a" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="485" y="56" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">RESEARCH PROJECT</text>

  <!-- Left Column: Real-Time IRT Difficulty Curve -->
  <g transform="translate(65, 85)">
    <rect x="0" y="0" width="265" height="135" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
    <text x="12" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600">Adaptive Ability Estimation (\u03b8 Level)</text>
    
    <!-- Grid -->
    <line x1="15" y1="40" x2="250" y2="40" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="15" y1="75" x2="250" y2="75" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="15" y1="110" x2="250" y2="110" stroke="#1e293b" stroke-width="1"/>
    
    <!-- IRT Curve -->
    <polygon points="20,110 50,95 85,100 120,70 160,55 200,45 245,35 245,110 20,110" fill="url(#curveGrad)"/>
    <polyline points="20,110 50,95 85,100 120,70 160,55 200,45 245,35" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Nodes -->
    <circle cx="120" cy="70" r="3.5" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="200" cy="45" r="3.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="245" cy="35" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    
    <text x="12" y="128" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600">\u2713 Item Response Theory (2PL-IRT)</text>
    <text x="180" y="128" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5">Target: NEP Tier 4</text>
  </g>

  <!-- Right Column: Non-Invasive Behavioral Telemetry & Inline Stress ML -->
  <g transform="translate(345, 85)">
    <rect x="0" y="0" width="190" height="135" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
    <text x="12" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600">Cognitive Stress Telemetry</text>
    
    <!-- Metric 1: Keystroke Hold/Flight -->
    <text x="12" y="42" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5">Key-Hold &amp; Flight Time</text>
    <rect x="12" y="47" width="166" height="6" rx="3" fill="#1e293b"/>
    <rect x="12" y="47" width="115" height="6" rx="3" fill="#38bdf8"/>
    
    <!-- Metric 2: Cursor Hover & Hesitation -->
    <text x="12" y="68" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5">Cursor-Hover &amp; Hesitation</text>
    <rect x="12" y="73" width="166" height="6" rx="3" fill="#1e293b"/>
    <rect x="12" y="73" width="138" height="6" rx="3" fill="#f59e0b"/>
    
    <!-- Metric 3: Option Toggle Variance -->
    <text x="12" y="94" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5">Option Toggling Frequency</text>
    <rect x="12" y="99" width="166" height="6" rx="3" fill="#1e293b"/>
    <rect x="12" y="99" width="70" height="6" rx="3" fill="#10b981"/>

    <!-- Stress Level Indicator -->
    <rect x="12" y="112" width="166" height="14" rx="7" fill="#1e293b"/>
    <text x="95" y="122.5" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Inline Stress: Normal (0.24)</text>
  </g>

  <!-- Bottom Benchmarking & Architecture Specs -->
  <g transform="translate(65, 235)">
    <!-- Spec 1 -->
    <rect x="0" y="0" width="150" height="52" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
    <text x="12" y="18" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700">PURE JVM RUNTIME</text>
    <text x="12" y="34" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">Spring Boot 3.x</text>
    <text x="12" y="45" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8">In-Memory Java ML Engine</text>

    <!-- Spec 2 -->
    <rect x="160" y="0" width="150" height="52" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
    <text x="172" y="18" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700">INFERENCE SPEED</text>
    <text x="172" y="34" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">&lt; 30ms Target</text>
    <text x="172" y="45" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8">Zero-Network Overhead</text>

    <!-- Spec 3 -->
    <rect x="320" y="0" width="150" height="52" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
    <text x="332" y="18" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700">NON-INVASIVE</text>
    <text x="332" y="34" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">DOM Telemetry</text>
    <text x="332" y="45" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8">No Camera \u2022 No Microphone</text>
  </g>
</svg>
