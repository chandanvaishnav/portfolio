<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDataDoctor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111c30" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bgDataDoctor)" rx="12"/>

  <!-- SQL & Dataset Dashboard Mockup -->
  <rect x="50" y="45" width="500" height="250" rx="8" fill="#15213b" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.5"/>
  
  <!-- Window Header -->
  <rect x="50" y="45" width="500" height="32" rx="8" fill="#0c1626"/>
  <circle cx="72" cy="61" r="4.5" fill="#ef4444"/>
  <circle cx="88" cy="61" r="4.5" fill="#f59e0b"/>
  <circle cx="104" cy="61" r="4.5" fill="#10b981"/>
  <text x="125" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">DataDoctor AI – SQL &amp; Data Studio</text>
  
  <!-- Query Box -->
  <rect x="70" y="90" width="460" height="60" rx="6" fill="#090e1a" stroke="#1e293b" stroke-width="1"/>
  <text x="85" y="112" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">SELECT</text>
  <text x="135" y="112" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11">category, AVG(revenue) AS avg_rev, COUNT(*) AS volume</text>
  <text x="85" y="132" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">FROM</text>
  <text x="120" y="132" fill="#a78bfa" font-family="Consolas, monospace" font-size="11">dataset_upload</text>
  <text x="220" y="132" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">GROUP BY</text>
  <text x="285" y="132" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11">category ORDER BY avg_rev DESC;</text>

  <!-- Data Table Mockup -->
  <rect x="70" y="162" width="460" height="112" rx="6" fill="#0d1728"/>
  <!-- Table Header -->
  <rect x="70" y="162" width="460" height="24" fill="#192843"/>
  <text x="85" y="178" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">Category</text>
  <text x="210" y="178" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">Avg Revenue ($)</text>
  <text x="330" y="178" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">Volume</text>
  <text x="440" y="178" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">Status</text>

  <!-- Row 1 -->
  <text x="85" y="202" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Enterprise Suite</text>
  <text x="210" y="202" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">$14,820.50</text>
  <text x="330" y="202" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">1,248</text>
  <rect x="438" y="192" width="55" height="14" rx="7" fill="#065f46"/>
  <text x="465" y="202" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" text-anchor="middle">Optimal</text>

  <!-- Row 2 -->
  <text x="85" y="226" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Cloud Analytics</text>
  <text x="210" y="226" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">$9,410.00</text>
  <text x="330" y="226" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">3,892</text>
  <rect x="438" y="216" width="55" height="14" rx="7" fill="#065f46"/>
  <text x="465" y="226" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" text-anchor="middle">Optimal</text>

  <!-- Row 3 -->
  <text x="85" y="250" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Developer Pro</text>
  <text x="210" y="250" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">$4,190.20</text>
  <text x="330" y="250" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">8,104</text>
  <rect x="438" y="240" width="55" height="14" rx="7" fill="#1e3a8a"/>
  <text x="465" y="250" fill="#bfdbfe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" text-anchor="middle">Growing</text>
</svg>
