<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bgGrad1)" rx="12"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#334155" stroke-width="0.7" opacity="0.3">
    <line x1="0" y1="68" x2="600" y2="68" />
    <line x1="0" y1="136" x2="600" y2="136" />
    <line x1="0" y1="204" x2="600" y2="204" />
    <line x1="0" y1="272" x2="600" y2="272" />
    <line x1="100" y1="0" x2="100" y2="340" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="300" y1="0" x2="300" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="500" y1="0" x2="500" y2="340" />
  </g>

  <!-- URL Analysis Window mockup -->
  <rect x="80" y="55" width="440" height="230" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="104" cy="75" r="4.5" fill="#ef4444"/>
  <circle cx="120" cy="75" r="4.5" fill="#f59e0b"/>
  <circle cx="136" cy="75" r="4.5" fill="#10b981"/>
  
  <!-- Address bar -->
  <rect x="156" y="66" width="344" height="18" rx="4" fill="#0f172a"/>
  <text x="168" y="79" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">https://verified-security-check.ai/inspect?target=...</text>
  
  <!-- Shield Icon and Analysis graphic -->
  <g transform="translate(140, 110)">
    <path d="M40 0 L75 15 C75 55 40 75 40 75 C40 75 5 55 5 15 Z" fill="url(#shieldGrad)" opacity="0.9"/>
    <!-- Checkmark inside shield -->
    <path d="M26 38 L36 48 L54 28" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Analysis Metrics Mockup -->
  <g transform="translate(240, 115)">
    <rect x="0" y="0" width="250" height="20" rx="4" fill="#0f172a"/>
    <text x="10" y="14" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">✓ SSL &amp; DNS Verification: Clean</text>
    
    <rect x="0" y="28" width="250" height="20" rx="4" fill="#0f172a"/>
    <text x="10" y="42" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">⚡ ML Model: 98.4% Confidence</text>
    
    <rect x="0" y="56" width="250" height="20" rx="4" fill="#0f172a"/>
    <text x="10" y="70" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">🛡 Risk Score: Low (0.02)</text>
  </g>

  <!-- Badge at bottom -->
  <rect x="195" y="220" width="210" height="28" rx="14" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="1"/>
  <text x="300" y="238" text-anchor="middle" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">PhishGuard Security Engine</text>
</svg>
